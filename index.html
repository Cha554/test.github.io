<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cha's Games</title>
<link rel="icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
        --radius:16px;--radius-sm:10px;
        --bg:#14100c;--bg-el:#1e1812;--bg-card:#261e16;
        --fg:#f0e4d4;--fg2:#a89478;--fg3:#5c4d3c;
        --accent:#c8956c;--accent-h:#daa882;--accent-d:#7a5a3c;
        --accent-g:rgba(200,149,108,.12);--accent-gs:rgba(200,149,108,.25);
        --warm:#e8a44a;--warm-g:rgba(232,164,74,.12);
        --border:rgba(200,149,108,.08);--border-h:rgba(200,149,108,.22);
        --shadow:rgba(0,0,0,.5);--glass:rgba(20,16,12,.7);
        --glow1:rgba(200,149,108,.06);--glow2:rgba(232,164,74,.04);
    }
    ::selection{background:var(--accent);color:#000}
    html{scroll-behavior:smooth}
    body{
        font-family:'DM Sans',sans-serif;
        background-color:var(--bg);
        color:var(--fg);
        line-height:1.6;
        overflow-x:hidden;
        min-height:100vh;
        -webkit-font-smoothing:antialiased;
    }

    /* --- BACKGROUND LAYERS --- */
    .bg-dots{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse 70% 50% at 50% 20%,black 15%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse 70% 50% at 50% 20%,black 15%,transparent 70%)}
    .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 700px 500px at 25% 15%,var(--glow1) 0%,transparent 70%),radial-gradient(ellipse 500px 400px at 75% 70%,var(--glow2) 0%,transparent 70%),radial-gradient(ellipse 400px 300px at 50% 50%,var(--glow1) 0%,transparent 70%);animation:glowShift 22s ease-in-out infinite alternate}
    @keyframes glowShift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-15px) scale(1.04)}100%{transform:translate(-10px,10px) scale(.97)}}
    .cursor-glow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--accent-g) 0%,transparent 55%);pointer-events:none;z-index:0;filter:blur(10px);will-change:transform;transform:translate(-210px,-210px);transition:opacity .3s}
    @media(hover:none){.cursor-glow{display:none}}

    /* --- NAV --- */
    nav{position:fixed;top:0;width:100%;z-index:100;padding:1rem 0;transition:all .4s cubic-bezier(.16,1,.3,1);border-bottom:1px solid transparent}
    nav.scrolled{padding:.6rem 0;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-bottom-color:var(--border);box-shadow:0 4px 24px var(--shadow)}
    .nav-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 1.5rem}
    .logo{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:700;color:var(--fg);text-decoration:none;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
    .logo-icon{width:32px;height:32px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--accent),var(--warm));display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px var(--accent-g);position:relative;overflow:hidden}
    .logo-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);animation:shine 3.5s ease-in-out infinite}
    @keyframes shine{0%,65%,100%{transform:translateX(-120%)}75%{transform:translateX(120%)}}
    .logo-icon svg{width:16px;height:16px;position:relative;z-index:1;color:#1e1812}
    .nav-links{display:flex;align-items:center;gap:1.5rem;list-style:none}
    .nav-links a,.nav-links button{color:var(--fg2);text-decoration:none;font-size:.85rem;font-weight:500;background:none;border:none;cursor:pointer;font-family:inherit;transition:color .2s;position:relative;padding:0}
    .nav-links a::after,.nav-links button::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1.5px;background:var(--accent);transition:width .3s cubic-bezier(.16,1,.3,1)}
    .nav-links a:hover,.nav-links button:hover{color:var(--fg)}
    .nav-links a:hover::after,.nav-links button:hover::after{width:100%}
    .mobile-toggle{display:none;background:none;border:none;color:var(--fg);cursor:pointer;padding:4px}

    /* --- HERO --- */
    .hero{min-height:48vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7rem 1.5rem 2.5rem;position:relative;z-index:2}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px 6px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--border);font-size:.78rem;font-weight:500;color:var(--fg2);margin-bottom:1.5rem;backdrop-filter:blur(16px);opacity:0;animation:fadeUp .8s .2s cubic-bezier(.16,1,.3,1) forwards}
    .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-h);box-shadow:0 0 8px var(--accent-gs);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .hero h1{font-family:'Fraunces',serif;font-size:clamp(2.5rem,6vw,4.2rem);line-height:1.05;margin-bottom:1rem;letter-spacing:-.04em;font-weight:700;opacity:0;animation:fadeUp .8s .3s cubic-bezier(.16,1,.3,1) forwards}
    .hero h1 .accent-text{background:linear-gradient(135deg,var(--accent),var(--warm) 80%);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gradShift 5s ease-in-out infinite alternate}
    @keyframes gradShift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
    .hero-sub{font-size:1rem;color:var(--fg2);max-width:480px;margin-bottom:2rem;line-height:1.7;opacity:0;animation:fadeUp .8s .45s cubic-bezier(.16,1,.3,1) forwards;transition:color .3s}
    .hero-search{width:100%;max-width:480px;position:relative;opacity:0;animation:fadeUp .8s .55s cubic-bezier(.16,1,.3,1) forwards}
    .hero-search input{width:100%;padding:1rem 1.2rem 1rem 3rem;background:var(--bg-el);border:1px solid var(--border);border-radius:99px;color:var(--fg);font-family:inherit;font-size:.95rem;outline:none;transition:all .3s}
    .hero-search input::placeholder{color:var(--fg3)}
    .hero-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-g),0 8px 30px var(--shadow)}
    .hero-search .search-icon{position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);color:var(--fg3);pointer-events:none;transition:color .2s}
    .hero-search input:focus~.search-icon{color:var(--accent)}

    /* --- TOOLBAR / TABS --- */
    .games-section{max-width:1280px;margin:0 auto;padding:0 1.5rem 6rem;position:relative;z-index:2}
    .games-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:1.75rem}
    .category-tabs{display:flex;gap:.4rem;flex-wrap:wrap}
    .cat-tab{padding:.5rem 1.3rem;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--fg2);font-family:'Fraunces',serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s;white-space:nowrap}
    .cat-tab:hover{border-color:var(--border-h);color:var(--fg);background:var(--accent-g)}
    .cat-tab.active{background:var(--accent);color:#1e1812;border-color:var(--accent);box-shadow:0 0 16px var(--accent-g)}
    .game-count{font-size:.78rem;color:var(--fg3);font-weight:500}

    /* --- GRID --- */
    .grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1);position:relative;display:flex;flex-direction:column;opacity:0;transform:translateY(14px)}
    .card.visible{opacity:1;transform:translateY(0)}
    .card:hover{transform:translateY(-6px);border-color:var(--border-h);box-shadow:0 14px 36px var(--shadow),0 0 20px var(--accent-g)}
    .card-thumb-container{width:100%;height:130px;overflow:hidden;background:var(--bg-el);position:relative}
    .movie-mode .card-thumb-container{height:300px}
    .card-thumb{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;display:block}
    .card:hover .card-thumb{transform:scale(1.06)}
    .card-info{padding:.85rem 1rem;text-align:left;border-top:1px solid var(--border)}
    .card-title{font-family:'Fraunces',serif;font-weight:600;font-size:.9rem;color:var(--fg);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hidden{display:none!important}

    .empty-state{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--fg3)}
    .empty-state svg{margin:0 auto 1rem;opacity:.3}
    .empty-state h3{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--fg2);margin-bottom:.5rem}
    .empty-state p{font-size:.86rem}

    /* --- FOOTER --- */
    footer{padding:2.5rem 1.5rem;text-align:center;border-top:1px solid var(--border);position:relative;z-index:2}
    .footer-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.5rem}
    footer p{color:var(--fg3);font-size:.85rem}
    footer b{color:var(--accent-h)}

    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeOut{from{opacity:1}to{opacity:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    @media(max-width:768px){
        .nav-links{display:none}
        .nav-links.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--bg-el);border-bottom:1px solid var(--border);padding:1rem 1.5rem;gap:.75rem;backdrop-filter:blur(30px)}
        .mobile-toggle{display:block}
        .hero{min-height:42vh;padding-top:6rem}
        .hero h1{font-size:clamp(2rem,8vw,3rem)}
        .grid-container{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
        .movie-mode .card-thumb-container{height:220px}
    }
</style>
</head>

<section class="hero">

</section>

<section class="games-section" id="games">

        <span class="game-count" id="itemCount"></span>
    </div>

    <div class="grid-container" id="game-grid"></div>
    <div class="grid-container movie-mode hidden" id="movie-grid"></div>
</section>

<footer>
    <div class="footer-inner">
        <p>Press <b>ESC</b> to Panic Swap to Google Drive</p>
    </div>
</footer>

    // ---------------------------------------------------------
    // 2. GRID GENERATION
    // ---------------------------------------------------------
    const gameGrid = document.getElementById('game-grid');
    const movieGrid = document.getElementById('movie-grid');

    games.forEach(game => gameGrid.appendChild(createCard(game, 'game')));
    movies.forEach(movie => movieGrid.appendChild(createCard(movie, 'movie')));

    function createCard(item, type) {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => launch(item.url);

        let searchQuery, width, height;
        if (type === 'game') {
            searchQuery = encodeURIComponent(item.name + " game app icon");
            width = 400; height = 300;
        } else {
            searchQuery = encodeURIComponent(item.name + " movie poster");
            width = 400; height = 600;
        }

        const imgUrl = `https://tse2.mm.bing.net/th?q=${searchQuery}&w=${width}&h=${height}&c=7&rs=1&p=0`;
        const fallbackUrl = `https://placehold.co/${width}x${height}/261e16/c8956c?text=${encodeURIComponent(item.name)}`;

        card.innerHTML = `
            <div class="card-thumb-container">
                <img src="${imgUrl}" class="card-thumb" onerror="this.src='${fallbackUrl}'" loading="lazy" alt="${item.name}">
            </div>
            <div class="card-info">
                <div class="card-title">${item.name}</div>
            </div>
        `;
        return card;
    }

    // reveal cards on load (staggered)
    function revealCards(container) {
        const cards = container.querySelectorAll('.card:not(.hidden)');
        cards.forEach((c, i) => {
            c.style.transitionDelay = `${Math.min(i * 20, 400)}ms`;
            requestAnimationFrame(() => c.classList.add('visible'));
        });
    }
    revealCards(gameGrid);

    function updateCount() {
        const activeGrid = document.querySelector('.grid-container:not(.hidden)');
        if (!activeGrid) return;
        const visible = [...activeGrid.children].filter(c => c.style.display !== 'none').length;
        document.getElementById('itemCount').textContent = `${visible} item${visible !== 1 ? 's' : ''}`;
    }

    // ---------------------------------------------------------
    // 3. TAB SYSTEM
    // ---------------------------------------------------------
    function switchTab(type) {
        const gameBtns = [document.getElementById('btn-games'), document.getElementById('nav-games')];
        const movieBtns = [document.getElementById('btn-movies'), document.getElementById('nav-movies')];
        const subtitle = document.getElementById('main-subtitle');
        document.getElementById('searchBar').value = '';
        filterItems();

        if (type === 'games') {
            gameBtns.forEach(b => b && b.classList.add('active'));
            movieBtns.forEach(b => b && b.classList.remove('active'));
            gameGrid.classList.remove('hidden');
            movieGrid.classList.add('hidden');
            subtitle.innerText = "Games By Cha";
            revealCards(gameGrid);
        } else {
            gameBtns.forEach(b => b && b.classList.remove('active'));
            movieBtns.forEach(b => b && b.classList.add('active'));
            gameGrid.classList.add('hidden');
            movieGrid.classList.remove('hidden');
            subtitle.innerText = "Movies By Cha";
            revealCards(movieGrid);
        }
        updateCount();
        document.getElementById('navLinks').classList.remove('open');
    }

    // 4. CLOAKED LAUNCHER
    // ---------------------------------------------------------
    function launch(url) {
        const modal = document.createElement('div');
        modal.id = 'game-modal';
        modal.style.cssText = `
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        `;

        const closeBtn = document.createElement('button');
        closeBtn.innerHTML = '✕ Close (ESC)';
        closeBtn.style.cssText = `
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100000;
            background: var(--accent);
            color: #1e1812;
            border: none;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 12px var(--shadow);
        `;
        closeBtn.onmouseover = () => { closeBtn.style.transform = 'scale(1.05)'; closeBtn.style.boxShadow = '0 6px 20px var(--shadow)'; };
        closeBtn.onmouseout = () => { closeBtn.style.transform = 'scale(1)'; closeBtn.style.boxShadow = '0 4px 12px var(--shadow)'; };

        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.style.cssText = `
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        `;
        iframe.allowFullscreen = true;

        const closeModal = () => {
            modal.style.animation = 'fadeOut 0.2s ease-out forwards';
            setTimeout(() => modal.remove(), 200);
        };

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('game-modal')) closeModal();
        });

        modal.appendChild(closeBtn);
        modal.appendChild(iframe);
        document.body.appendChild(modal);
        document.body.style.overflow = 'hidden';

        const cleanupObserver = new MutationObserver(() => {
            if (!document.getElementById('game-modal')) {
                document.body.style.overflow = '';
                cleanupObserver.disconnect();
            }
        });
        cleanupObserver.observe(document.body, { childList: true });
    }

    // ---------------------------------------------------------
    // 5. FILTER FUNCTION
    // ---------------------------------------------------------
    function filterItems() {
        const input = document.getElementById('searchBar').value.toLowerCase();
        const activeGrid = document.querySelector('.grid-container:not(.hidden)');
        if (!activeGrid) return;

        const cards = activeGrid.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            const title = cards[i].querySelector('.card-title').innerText.toLowerCase();
            const match = title.includes(input);
            cards[i].style.display = match ? "flex" : "none";
        }
        updateCount();
    }

    // ---------------------------------------------------------
    // 6. NAV SCROLL + MOBILE MENU + CURSOR GLOW
    // ---------------------------------------------------------
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 30), { passive: true });

    document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('navLinks').classList.toggle('open');
    });

    function scrollTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('navLinks').classList.remove('open');
    }

    const cursorGlow = document.getElementById('cursorGlow');
    let glowX = -210, glowY = -210;
    document.addEventListener('mousemove', e => { glowX = e.clientX; glowY = e.clientY; });
    document.addEventListener('mouseleave', () => cursorGlow.style.opacity = '0');
    document.addEventListener('mouseenter', () => cursorGlow.style.opacity = '1');
    (function animGlow() {
        cursorGlow.style.transform = `translate(${glowX - 210}px, ${glowY - 210}px)`;
        requestAnimationFrame(animGlow);
    })();

    window.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && !document.getElementById('game-modal')) {
            window.location.replace("https://drive.google.com");
        }
    });

    updateCount();
</script>

</body>
</html>
